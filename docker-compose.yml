version: '3.8'

services:
  api:
    build:
      context: .
      args:
        BUILD_MODE: ${BUILD_MODE:-full}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models # Mount models directory for hot-reloading models
    environment:
      - ENV=development
      - OPENDEPLOY_API_KEY=secret-key-123
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: always
