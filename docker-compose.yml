version: '3.8'

services:
  api:
    build:
      context: .
      args:
        BUILD_MODE: ${BUILD_MODE:-full}
        BASE_IMAGE: ${BASE_IMAGE:-python:3.10-slim}
    ipc: host
    volumes:
      - ./models:/app/models # Mount models directory for hot-reloading models
    environment:
      - ENV=development
      - OPENDEPLOY_API_KEY=${OPENDEPLOY_API_KEY}
      - OPENDEPLOY_ALLOWED_ORIGINS=${OPENDEPLOY_ALLOWED_ORIGINS:-https://localhost:3443,https://127.0.0.1:3443,https://192.168.1.154:3443,https://lebryanjaimes.tail2e3158.ts.net:3443}
      - OPENDEPLOY_RATE_LIMIT_PER_MIN=${OPENDEPLOY_RATE_LIMIT_PER_MIN:-60}
      - OPENDEPLOY_MAX_BODY_MB=${OPENDEPLOY_MAX_BODY_MB:-10}
      - OPENDEPLOY_MAX_FRAME_WIDTH=${OPENDEPLOY_MAX_FRAME_WIDTH:-1920}
      - OPENDEPLOY_MAX_FRAME_HEIGHT=${OPENDEPLOY_MAX_FRAME_HEIGHT:-1080}
      - OPENDEPLOY_MAX_FRAME_BYTES=${OPENDEPLOY_MAX_FRAME_BYTES:-8294400}
      - OPENDEPLOY_LAZY_LOAD=true
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      - OPENDEPLOY_SHM_PATH=/dev/shm/opendeploy_frames
      - OPENDEPLOY_RING_SLOTS=${OPENDEPLOY_RING_SLOTS:-64}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

  webrtc-gateway:
    build:
      context: ./webrtc-gateway
    ipc: host
    environment:
      - WEBRTC_HTTP_ADDR=:7000
      - OPENDEPLOY_API_KEY=${OPENDEPLOY_API_KEY}
      - OPENDEPLOY_ALLOWED_ORIGINS=${OPENDEPLOY_ALLOWED_ORIGINS:-https://localhost:3443,https://127.0.0.1:3443,https://192.168.1.154:3443,https://lebryanjaimes.tail2e3158.ts.net:3443}
      - OPENDEPLOY_MAX_FRAME_WIDTH=${OPENDEPLOY_MAX_FRAME_WIDTH:-1920}
      - OPENDEPLOY_MAX_FRAME_HEIGHT=${OPENDEPLOY_MAX_FRAME_HEIGHT:-1080}
      - OPENDEPLOY_MAX_FRAME_BYTES=${OPENDEPLOY_MAX_FRAME_BYTES:-8294400}
      - OPENDEPLOY_SHM_PATH=/dev/shm/opendeploy_frames
      - OPENDEPLOY_RING_SLOTS=${OPENDEPLOY_RING_SLOTS:-64}
    restart: always

  frontend:
    build:
      context: ./frontend/dashboard
    ports:
      - "3001:3000"
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "3443:443"
      - "3080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/webrtc-client.html:/usr/share/nginx/html/webrtc-client.html:ro
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - webrtc-gateway
      - frontend
    restart: always

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: always
