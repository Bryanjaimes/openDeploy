version: '3.8'

services:
  api:
    build:
      context: .
      args:
        BUILD_MODE: ${BUILD_MODE:-full}
        BASE_IMAGE: ${BASE_IMAGE:-python:3.10-slim}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models # Mount models directory for hot-reloading models
    environment:
      - ENV=development
      - OPENDEPLOY_API_KEY=secret-key-123
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    device_requests:
      - driver: nvidia
        count: all
        capabilities: [gpu]
    restart: always

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: always
