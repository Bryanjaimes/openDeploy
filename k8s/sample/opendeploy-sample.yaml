apiVersion: opendeploy.dev/v1alpha1
kind: OpenDeploy
metadata:
  name: opendeploy-demo
spec:
  model: mistral-small
  image: ghcr.io/bryanjaimes/opendeploy:latest
  replicas: 1
  port: 8000
  env:
    - name: OPENDEPLOY_LAZY_LOAD
      value: "true"
  resources:
    cpu: "1"
    memory: "2Gi"
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70
  keda:
    minReplicas: 0
    maxReplicas: 5
    pollingInterval: 10
    cooldownPeriod: 60
    triggers:
      - type: prometheus
        metadata:
          serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          metricName: opendeploy_rps
          query: sum(rate(opendeploy_requests_total{service="opendeploy-demo"}[1m]))
          threshold: "1"
