apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: opendeploy-gpu
spec:
  amiFamily: AL2
  role: KarpenterNodeRole-opendeploy
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: opendeploy
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: opendeploy
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
