apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: opendeploy-gpu
spec:
  template:
    spec:
      nodeClassRef:
        name: opendeploy-gpu
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot"]
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values: ["g5.xlarge"]
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 120s
  limits:
    cpu: "32"
